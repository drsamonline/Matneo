<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>Page not found — MATNEO</title>
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="/Matneo/assets/favicon.svg" type="image/svg+xml">
<style>
  /* Self-contained on purpose. A 404 is served for a URL that does not exist, at
     any depth, so a relative stylesheet href resolves against the missing path and
     an absolute one only works while the site stays at /Matneo/. Neither is a
     dependable way to get a stylesheet onto this page, so the page carries its
     own — it is four rules. */
  :root{
    --ink:#14161c; --muted:#636b7e; --paper:#fbfaf8; --surface:#fff; --hairline:#e6e3dc;
    --acc:#4f46e5; --acc-2:#7c3aed;
    --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --display:ui-serif,"Iowan Old Style",Georgia,"Palatino Linotype","Times New Roman",serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:clamp(1.4rem,5vw,3rem);
    font-family:var(--font);color:var(--ink);background:var(--paper);
    background-image:
      radial-gradient(46rem 30rem at 14% -10%,#eef0fe,transparent 62%),
      radial-gradient(40rem 26rem at 96% 4%,#f2ecfd,transparent 60%);
    -webkit-font-smoothing:antialiased;
  }
  .card{
    max-width:600px;width:100%;text-align:center;padding:clamp(2.2rem,5vw,3.4rem);
    background:var(--surface);border:1px solid var(--hairline);border-radius:22px;
    box-shadow:0 24px 56px -24px rgba(20,22,28,.30);
  }
  .mark{width:56px;height:56px;margin:0 auto 1.4rem;display:block}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.74rem;
    font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--acc)}
  h1{margin:.7rem 0 0;font-family:var(--display);font-weight:600;
    font-size:clamp(1.8rem,5vw,2.5rem);line-height:1.1;letter-spacing:-.025em}
  p{color:var(--muted);margin:1rem 0 1.9rem;font-size:1rem;line-height:1.6}
  .actions{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center}
  a.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
    padding:.78rem 1.25rem;border-radius:12px;font-weight:700;font-size:.95rem;
    text-decoration:none;border:1px solid transparent;
    transition:transform .16s ease,box-shadow .16s ease}
  a.primary{background:linear-gradient(135deg,var(--acc),var(--acc-2));color:#fff;
    box-shadow:0 12px 26px -14px rgba(79,70,229,.85)}
  a.primary:hover{transform:translateY(-2px)}
  a.ghost{background:var(--surface);color:var(--ink);border-color:#d6d2c8}
  a.ghost:hover{transform:translateY(-2px);border-color:#d9dbfb}
  @media (prefers-reduced-motion:reduce){a.btn{transition:none}}
</style>
</head>
<body>
  <main class="card">
    <svg class="mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="48" y2="48">
        <stop stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
      <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#g)"/>
      <circle cx="16" cy="18" r="3" fill="#fff"/>
      <circle cx="32" cy="16" r="2.4" fill="#fff" opacity=".85"/>
      <circle cx="24" cy="31" r="3.2" fill="#fff"/>
      <path d="M16 18 24 31M32 16 24 31M16 18 32 16" stroke="#fff" stroke-width="1.6" opacity=".8"/>
    </svg>
    <span class="code">Error 404</span>
    <h1>This page isn’t on the shelf</h1>
    <p>The link you followed points at something that has moved or never existed. The catalogue is one click away.</p>
    <div class="actions">
      <a class="btn primary" href="/Matneo/products/">Browse the shop</a>
      <a class="btn ghost" href="/Matneo/">Back to home</a>
    </div>
  </main>
</body>
</html>
