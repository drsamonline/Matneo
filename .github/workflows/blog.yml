name: Refresh blog posts

# Regenerates from the SHARED module drsoam.py (app-builder), so every output
# uses one exclusion list and cannot drift.

on:
  schedule:
    - cron: "12 4 * * *"
  push:
    branches: [ main ]
    paths: [ .github/workflows/blog.yml ]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-content
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
        with:
          repository: drsamonline/app-builder
          path: .drsoam
      - name: Regenerate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .drsoam/drsoam.py posts
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "no change"; exit 0; fi
          git config user.name  "forge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/posts.json
          git commit -m "chore: refresh blog posts [skip ci]"
          git pull --rebase --autostash
          git push
