name: Refresh blog posts

# Regenerates from the SHARED module drsoam.py (app-builder), so every output
# uses one exclusion list and cannot drift.

on:
  schedule:
    - cron: "12 4 * * 2"   # weekly, Tuesday 04:12 UTC
  push:
    branches: [ main ]
    paths: [ .github/workflows/blog.yml ]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-content
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
        with:
          # fetch-depth 0, not 1: commit-and-verify.sh retries by rebasing onto
          # origin/main, and a depth-1 clone has no merge base, so every rebase
          # failed and the retry loop was dead code - exactly when it was needed.
          # 2026-11-06: the blog run lost six rebases to this and went red while the
          # store run beside it committed fine.
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
        with:
          fetch-depth: 1
          repository: drsamonline/app-builder
          path: .drsoam
      - name: Regenerate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .drsoam/drsoam.py posts
      # The landing is done by commit-and-verify.sh, which no longer rebases: the
      # file is generated on both sides, so a rebase conflicted on it every time and
      # the six-attempt retry loop re-ran a doomed rebase. It now resets to
      # origin/main and lays this run's bytes back on top. Full history is still
      # fetched because the fetch/reset path wants the ref, not because of rebase.
      - name: Commit if changed
        run: |
          # F-97: the verdict is "did posts.json land", not "did git exit 0".
          # MANIFEST.json travels with the file it describes. The blog refresh landed at
          # 12:54:36 on 2026-11-10, 45 seconds AFTER the manifest record was committed at
          # 12:53:51 - and because only the JSON was staged, the record never caught up
          # and every later run was refused as "committed-drift".
          bash tools/commit-and-verify.sh "chore: refresh blog posts [skip ci]" main -- docs/data/posts.json MANIFEST.json