# store-images — capture a real image per product, and check it.
#
# SPDX-FileCopyrightText: 2026 Dr Sohil Momin
# SPDX-License-Identifier: LicenseRef-Forge-Proprietary
#
# THE OWNER REPORTED THIS AND IT WAS NEVER QUEUED:
#   "matneo pages dont display card images of the repose, it should automatically"
#   "the app pages on matneo are empty nothing shows on the pages"
#
# A demo is a REPRODUCIBLE SCRIPT, not a person with a screenshot tool
# (charmbracelet/vhs makes the same argument for terminal GIFs). So: point
# shot-scraper at each product's live page at a FIXED viewport, then turn each capture
# into a small deterministic set - a few widths, the format chosen by MEASUREMENT
# (encode in each candidate, keep the smallest that passes a quality bar), a blurred
# LQIP so the card appears instantly, and a dated manifest.
#
# NO INVENTED IMAGERY. A product with no live URL gets no image and says so. Never a
# placeholder pretending to be a screenshot.

name: store-images

on:
  schedule:
    - cron: "41 3 * * *"   # after the store refresh
  workflow_dispatch:
    inputs:
      limit:
        description: "Capture at most this many products (0 = all)"
        type: number
        required: false
        default: 0

permissions:
  contents: write

concurrency:
  group: store-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # was @v5
        with:
          python-version: "3.12"
      - name: Install the tools
        run: |
          python -m pip install --quiet --upgrade pip shot-scraper pillow
          # shot-scraper drives its OWN Chromium; without this the capture
          # step fails with a browser-not-found error nobody would guess
          shot-scraper install
      - name: Capture each product's live page, deterministically
        run: |
          set -uo pipefail
          mkdir -p shots
          python3 - <<'PY'
          import json, pathlib
          # THE STORE'S OWN DATA FILE. The first version of this looked for products.json
          # at the repo root, which does not exist - so it found no products, captured
          # nothing, and reported success. The list is docs/data/products.json, and each
          # entry carries `link` / `landingPage` and an `image` field to fill.
          p = pathlib.Path("docs/data/products.json")
          if not p.exists():
              print("::warning::docs/data/products.json not found - nothing to capture")
              pathlib.Path("capture-list.txt").write_text("", encoding="utf-8")
              raise SystemExit(0)
          items = json.loads(p.read_text(encoding="utf-8"))
          if isinstance(items, dict):
              items = items.get("products") or items.get("items") or []
          out = []
          for it in items:
              if not isinstance(it, dict): continue
              key = it.get("id") or it.get("slug")
              url = it.get("landingPage") or it.get("link")
              if key and url: out.append((key, url))
          print(f"{len(out)} product(s) with a live URL, of {len(items)} in the store")
          pathlib.Path("capture-list.txt").write_text(
              "\n".join(f"{k}\t{u}" for k, u in out), encoding="utf-8")
          PY
          n=0
          while IFS=$'\t' read -r key url; do
            [ -z "${key:-}" ] && continue
            # a FIXED viewport and a fixed scroll position, so two runs agree
            shot-scraper shot "$url" --width 1280 --height 2400 --wait 1200 \
              --output "shots/${key}.png" 2>/dev/null || echo "  could not capture $key"
            n=$((n+1))
          done < capture-list.txt
          echo "captured $n product(s)"
          ls -la shots | head -20
      - name: Generate the deterministic set
        run: |
          if [ -z "$(ls -A shots 2>/dev/null)" ]; then
            echo "::warning::nothing captured - no images generated, and no placeholder invented"
            exit 0
          fi
          python3 tools/store-images.py --source shots --out images
      - name: Check the budget, the alt text and the loading
        run: |
          if [ ! -f images/manifest.json ]; then
            echo "::warning::no manifest - nothing was generated"; exit 0
          fi
          python3 tools/store-images.py --check --out images
      - name: Point each product at its generated image
        run: |
          set -uo pipefail
          [ -f images/manifest.json ] || { echo "no manifest - nothing to wire"; exit 0; }
          python3 - <<'PY'
          import json, pathlib
          mf = pathlib.Path("images/manifest.json")
          man = json.loads(mf.read_text(encoding="utf-8"))
          have = {k: v for k, v in (man.get("products") or {}).items() if v}
          if not have:
              print("no generated images to wire"); raise SystemExit(0)
          p = pathlib.Path("docs/data/products.json")
          items = json.loads(p.read_text(encoding="utf-8"))
          n = 0
          for it in items:
              if not isinstance(it, dict): continue
              e = have.get(it.get("id") or "")
              if not e: continue
              src = "images/" + e["card"]["file"]
              # the store's own image path, and the captured date so staleness is visible
              if it.get("image") != src:
                  it["image"] = src; n += 1
              it["imageWidth"] = 1200
              it["imageHeight"] = 630
              # the product's OWN words, not a title-cased slug. Alt text is what a
              # screen reader reads and what shows when an image fails, so a slug is
              # the worst possible choice for it.
              it["imageAlt"] = it.get("tagline") or it.get("title") or e.get("alt") or ""
              it["imageLoading"] = e.get("loading", "lazy")
              it["imageCaptured"] = e.get("captured")
          p.write_text(json.dumps(items, indent=2, ensure_ascii=False), encoding="utf-8")
          print(f"wired {n} product image path(s)")
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "no change"; exit 0; fi
          git config user.name  "forge-bot"
          git config user.email "bot@users.noreply.github.com"
          # THE WIRING IS PART OF THE CHANGE. The first version added only `images`,
          # so the step that points each product at its card ran, wrote the file, and
          # the file was never committed - 45 images landed and 0 of 46 products were
          # wired. Add both, and say what is being committed.
          for f in images docs/data/products.json; do [ -e "$f" ] && git add -- "$f"; done
          echo "staged: $(git diff --cached --name-only | wc -l) path(s)"
          git commit -m "chore(images): regenerate the product cards [skip ci]"
          # F-97: a push that exited 0 is not proof the change reached the branch.
          # commit-and-verify.sh is NOT used here: this step stages a DIRECTORY, and the
          # script hashes regular files - it would skip it and report that nothing was
          # produced, which is a false red.
          #
          # The verdict compares the COMMIT TREE instead: if origin/main's tree is this
          # commit's tree, everything staged is on the branch.
          BR="${GITHUB_REF_NAME:-main}"
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin "$BR" --quiet
            git rebase "origin/$BR" --quiet || { git rebase --abort 2>/dev/null || echo "::notice::no rebase was in progress to abort"; sleep 4; continue; }
            if git push --quiet origin "HEAD:$BR"; then pushed=1; break; fi
            echo "::warning::push rejected on attempt $attempt - the branch moved again"
            sleep 4
          done
          if [ "$pushed" != 1 ]; then
            echo "::error::could not push after 4 attempts - another workflow keeps moving the branch"
            exit 1
          fi
          git fetch origin "$BR" --quiet
          want="$(git rev-parse 'HEAD^{tree}')"
          got="$(git rev-parse "origin/$BR^{tree}" 2>/dev/null || echo absent)"
          if [ "$want" = "$got" ]; then
            echo "VERIFIED: origin/$BR has this commit's tree - everything staged landed"
            exit 0
          fi
          echo "::error::the branch tree does not match this commit (want $want, found $got)"
          exit 1