name: Refresh store catalogue

# Regenerates from the SHARED module drsoam.py (app-builder), so every output
# uses one exclusion list and cannot drift.

on:
  schedule:
    - cron: "22 4 * * 2"   # weekly, Tuesday 04:22 UTC
  push:
    branches: [ main ]
    paths: [ .github/workflows/store.yml ]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-content
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
        with:
          # fetch-depth 0, not 1: commit-and-verify.sh retries by rebasing onto
          # origin/main, and a depth-1 clone has no merge base, so every rebase
          # failed and the retry loop was dead code - exactly when it was needed.
          # 2026-11-06: the blog run lost six rebases to this and went red while the
          # store run beside it committed fine.
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
        with:
          fetch-depth: 1
          repository: drsamonline/app-builder
          path: .drsoam
      - name: Regenerate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .drsoam/drsoam.py store
      - name: Commit if changed
        run: |
          # F-97: the verdict is "did products.json land", not "did git exit 0".
          # MANIFEST.json is part of the output. drsoam.py RECORDS the hash of what it
          # wrote, and if that record is not committed with the file the next run sees
          # "committed-drift" and refuses to write - forever. That is exactly what froze
          # the catalogue: the record was made in the runner and thrown away, so the
          # committed hash could never catch up with the committed file.
          bash tools/commit-and-verify.sh "chore: refresh store catalogue [skip ci]" main -- docs/data/products.json MANIFEST.json